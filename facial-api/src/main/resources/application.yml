server:
  port: 8080

spring:
  application:
    name: facial-recognition-platform

  datasource:
    url: jdbc:h2:mem:facialdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    consumer:
      group-id: biometric-access-group
      auto-offset-reset: earliest

facial:
  camera:
    type: simulated # Options: 'simulated', 'webcam', 'rtsp'
    device-index: 0
    rtsp-url: ""
  kafka:
    topic: biometric-access-events
    group-id: biometric-access-group

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
